client_max_body_size 10m;

# 403 (from nginx or the upstream) is reported as not found
proxy_intercept_errors on;
error_page 403 =404 /__not_found;

location = /__not_found {
    internal;
    default_type text/plain;
    return 404 "Not Found";
}

location / {
    proxy_pass http://api;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # $remote_addr is the real client IP (restored from CF-Connecting-IP by the
    # realip module when the request comes from Cloudflare). Overwrites any
    # client-supplied value, so the backend gets exactly one trusted entry.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header True-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

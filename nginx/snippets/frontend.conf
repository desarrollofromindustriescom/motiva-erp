root /usr/share/nginx/html;
index index.html;

# 403 is reported as not found
error_page 403 =404 /__not_found;

location = /__not_found {
    internal;
    default_type text/plain;
    return 404 "Not Found";
}

# Never expose hidden files
location ~ /\. {
    return 404;
}

location / {
    try_files $uri $uri/index.html /index.html;
}

location /assets/ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
}

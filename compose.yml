services:
   postgres-db:
      container_name: motiva-pgdb
      image: postgres:18-alpine
      restart: unless-stopped
      expose:
         - '${DB_PORT}'
      networks:
         - motiva_net
      environment:
         - POSTGRES_DB=${POSTGRES_DB}
         - POSTGRES_USER=${POSTGRES_USER}
         - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      volumes:
         - ./database:/docker-entrypoint-initdb.d:ro
         - pgdata:/var/lib/postgresql/18/docker
      healthcheck:
         test: ['CMD', 'pg_isready', '-U', '${POSTGRES_USER}', '-d', '${POSTGRES_DB}']
         start_period: 15s
         interval: 5s
         timeout: 10s
         retries: 5
   golang-api:
      container_name: motiva-goapi
      restart: unless-stopped
      build:
         context: ./backend/
         dockerfile: Dockerfile
         target: prod
      expose:
         - '${API_PORT}'
      networks:
         - motiva_net
      environment:
         - ENV=${ENV}
         - API_PORT=${API_PORT}
         - DB_HOST=${DB_HOST}
         - DB_PORT=${DB_PORT}
         - POSTGRES_DB=${POSTGRES_DB}
         - POSTGRES_USER=${POSTGRES_USER}
         - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
         - ALLOW_ORIGINS=${ALLOW_ORIGINS}
      depends_on:
         postgres-db:
            condition: service_healthy
            restart: true
   nginx:
      container_name: motiva-nginx
      restart: unless-stopped
      build:
         context: .
         dockerfile: nginx/Dockerfile
      ports:
         - '80:80'
      networks:
         - motiva_net
      environment:
         - API_HOST=golang-api
         - API_PORT=${API_PORT}
      depends_on:
         - golang-api

volumes:
   pgdata:

networks:
   motiva_net:
      driver: bridge

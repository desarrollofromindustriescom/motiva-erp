services:
   postgres-db:
      container_name: motiva-pgdb
      image: postgres:18-alpine
      restart: unless-stopped
      expose:
         - "${DB_PORT}"
      networks:
         - motiva_net
      environment:
         - POSTGRES_DB=${POSTGRES_DB}
         - POSTGRES_USER=${POSTGRES_USER}
         - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      volumes:
         - ./database:/docker-entrypoint-initdb.d:ro
         - pgdata:/var/lib/postgresql/18/docker
      healthcheck:
         test:
            [
               "CMD",
               "pg_isready",
               "-U",
               "${POSTGRES_USER}",
               "-d",
               "${POSTGRES_DB}",
            ]
         start_period: 15s
         interval: 5s
         timeout: 10s
         retries: 5

volumes:
   pgdata:

networks:
   motiva_net:
      driver: bridge